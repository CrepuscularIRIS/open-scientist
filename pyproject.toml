[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-scientist"
version = "0.3.0"
description = "Open Scientist: a question-driven research engine (Forge) with adaptive domain and task assets, for Claude Code and Codex"
requires-python = ">=3.10"
license = {text = "MIT AND Apache-2.0"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
extend-exclude = ["vendor"]
